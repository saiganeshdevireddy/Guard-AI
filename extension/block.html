<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guard AI blocked this link</title>
  <link rel="stylesheet" href="block.css">
  <script src="block.js" defer></script>
</head>
<body>
  <main class="card" role="alert">
    <p class="eyebrow">GUARD AI LINK PROTECTION</p>
    <h1>Dangerous link blocked</h1>
    <section aria-labelledby="warning-heading">
      <h2 id="warning-heading">Warning</h2>
      <p id="english-warning"></p>
      <p id="telugu-warning" lang="te"></p>
    </section>
    <section aria-labelledby="url-heading">
      <h2 id="url-heading">Blocked URL</h2>
      <p id="blocked-url" class="url"></p>
    </section>
    <button id="go-back" type="button">Go back</button>
  </main>
</body>
</html>
